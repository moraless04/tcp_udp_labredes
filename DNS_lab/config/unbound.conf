server:
    interface: 0.0.0.0
    port: 53
    access-control: 10.53.0.0/24 allow

    username: "unbound"
    chroot: ""
    directory: "/etc/unbound"
    do-daemonize: no
    use-syslog: no
    logfile: ""
    verbosity: 1

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    hide-identity: yes
    hide-version: yes
    prefetch: no
    cache-min-ttl: 0
    cache-max-ttl: 86400
    edns-buffer-size: 1232

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    control-use-cert: no

forward-zone:
    name: "."
    forward-first: yes
    forward-addr: 1.1.1.1
    forward-addr: 8.8.8.8
